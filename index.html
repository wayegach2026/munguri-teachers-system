<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munguri Teachers System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b3d91, #1976d2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .school-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #0b3d91;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        h1 {
            color: #0b3d91;
            font-size: 27px;
            margin-bottom: 8px;
        }

        h2 {
            color: #444;
            font-size: 19px;
            margin-bottom: 15px;
        }

        .motto {
            color: #1976d2;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login {
            background: #0b3d91;
            color: white;
        }

        .register {
            background: #e8f1ff;
            color: #0b3d91;
            border: 2px solid #0b3d91;
        }

        button:hover {
            opacity: 0.85;
        }

        .footer {
            margin-top: 30px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="school-icon">
            🏫
        </div>

        <h1>MUNGURI TEACHERS SYSTEM</h1>

        <h2>SHULE YA MSINGI MUNGURI</h2>

        <p class="motto">
            “Elimu, Nidhamu na Kazi”
        </p>

        <div class="buttons">

            <a href="login.html" style="text-decoration:none;">
    <button class="login">🔐 INGIA</button>
</a>
            </button>

            <button class="register" onclick="alert('Ukurasa wa usajili utaongezwa hivi karibuni.')">
                📝 JISAJILI
            </button>

        </div>

        <div class="footer">
            Mfumo wa kidijitali wa walimu wa Shule ya Msingi Munguri
        </div>

    </div>

</body>
</html>
<a href="register.html" style="text-decoration:none;">
    <button class="register">📝 JISAJILI</button>
</a>

<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitabu vya Kiada - Munguri Teachers System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 15px;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .book {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .book-icon {
            font-size: 45px;
        }

        .book h3 {
            color: #0d47a1;
        }

        .btn {
            display: inline-block;
            padding: 11px 16px;
            margin-top: 8px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            background: #1976d2;
        }

        .message {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 30px;
            padding: 14px;
            background: #0d47a1;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>📘 VITABU VYA KIADA</h1>
    <p>Munguri Teachers System</p>
</header>

<div class="container">

    <div class="filters">

        <label>🎓 Chagua Darasa</label>

        <select id="darasa" onchange="onyeshaVitabu()">
            <option value="">Chagua Darasa</option>
            <option value="1">Darasa la Kwanza</option>
            <option value="2">Darasa la Pili</option>
            <option value="3">Darasa la Tatu</option>
            <option value="4">Darasa la Nne</option>
            <option value="5">Darasa la Tano</option>
            <option value="6">Darasa la Sita</option>
            <option value="7">Darasa la Saba</option>
        </select>

    </div>

    <div id="ujumbe" class="message">
        📚 Tafadhali chagua darasa ili kuona vitabu.
    </div>

    <div id="vitabu" class="books"></div>

    <a href="maktaba.html" class="back">
        ⬅️ Rudi Maktaba
    </a>

    <a href="dashboard.html" class="back">
        🏠 Rudi Dashboard
    </a>

</div>

<script>

function onyeshaVitabu() {

    let darasa = document.getElementById("darasa").value;
    let vitabu = document.getElementById("vitabu");
    let ujumbe = document.getElementById("ujumbe");

    vitabu.innerHTML = "";

    if (darasa === "") {
        ujumbe.style.display = "block";
        return;
    }

    ujumbe.style.display = "none";

    let vitabuDarasa = {

        "1": [
            ["📘", "Hisabati", "Hisabati"]
        ],

        "2": [
            ["📘", "Hisabati", "Hisabati"]
        ],

        "3": [
            ["📘", "Hisabati", "Hisabati"]
        ],

        "4": [
            ["📘", "Hisabati", "Hisabati"],
            ["📗", "Kiswahili", "Kiswahili"],
            ["📙", "Sayansi", "Sayansi na Teknolojia"]
        ],

        "5": [
            ["📘", "Hisabati", "Hisabati"],
            ["📗", "Kiswahili", "Kiswahili"],
            ["📙", "Sayansi", "Sayansi na Teknolojia"]
        ],

        "6": [
            ["📘", "Hisabati", "Hisabati"],
            ["📗", "Kiswahili", "Kiswahili"],
            ["📙", "Sayansi", "Sayansi na Teknolojia"]
        ],

        "7": [
            ["📘", "Hisabati", "Hisabati"],
            ["📗", "Kiswahili", "Kiswahili"],
            ["📙", "Sayansi", "Sayansi na Teknolojia"],
            ["📕", "English", "English"],
            ["📔", "Maarifa ya Jamii", "Maarifa ya Jamii"],
            ["📓", "Uraia na Maadili", "Uraia na Maadili"]
        ]
    };

    let vitabuVyaDarasa = vitabuDarasa[darasa];

    vitabuVyaDarasa.forEach(function(kitabu) {

        vitabu.innerHTML += `
            <div class="book">

                <div class="book-icon">${kitabu[0]}</div>

                <h3>Kitabu cha ${kitabu[1]}</h3>

                <p><strong>Darasa:</strong> Darasa la ${darasa}</p>

                <p><strong>Somo:</strong> ${kitabu[2]}</p>

                <a href="https://ol.tie.go.tz/uploaded_files/books/primary/Eng/Std4/Hisabati/Hisabati_Std_4.html" target="_blank" class="btn">
    📖 Fungua Kitabu
</a>
                

            </div>
        `;

    });

}

</script>

</body>
</html>

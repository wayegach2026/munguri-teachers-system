<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasifu wa Mwalimu - Munguri Teachers System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #0b3d91, #1976d2);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 25px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #0b3d91;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 9px;
            background: #0b3d91;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b3d91;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🏫 MUNGURI TEACHERS SYSTEM</h1>
        <p>Wasifu wa Mwalimu</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>👤 Wasifu wa Mwalimu</h2>

            <label>Jina Kamili</label>
            <input type="text" placeholder="Andika jina kamili">

            <label>Namba ya Simu</label>
            <input type="tel" placeholder="07XXXXXXXX">

            <label>Barua Pepe</label>
            <input type="email" placeholder="Andika barua pepe">

            <label>Somo Unalofundisha</label>
            <input type="text" placeholder="Mfano: Hisabati">

            <label>Darasa</label>
            <select>
                <option>Chagua darasa</option>
                <option>Darasa la Kwanza</option>
                <option>Darasa la Pili</option>
                <option>Darasa la Tatu</option>
                <option>Darasa la Nne</option>
                <option>Darasa la Tano</option>
                <option>Darasa la Sita</option>
                <option>Darasa la Saba</option>
            </select>

            <button onclick="alert('Taarifa za wasifu zimehifadhiwa kwa muda.')">
                💾 HIFADHI TAARIFA
            </button>

            <a class="back" href="dashboard.html">
                ← Rudi Dashboard
            </a>

        </div>

    </div>

</body>
</html>
